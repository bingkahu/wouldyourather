<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submit a Question — Would You Rather</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="container">
  <section class="card">
    <h2>Submit a Question</h2>
    <form id="submitForm">
      <label>Option A<input name="option_a" required></label>
      <label>Option B<input name="option_b" required></label>
      <label>Category<input name="category" placeholder="general"></label>
      <div style="margin-top:12px">
        <button class="btn" type="submit">Submit</button>
      </div>
    </form>
  </section>
</main>
<script>
document.getElementById('submitForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const f = e.target;
  const data = { option_a: f.option_a.value, option_b: f.option_b.value, category: f.category.value || 'general' };
  const res = await fetch('/api/submit', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
  const json = await res.json();
  if (json.success) {
    alert('Submitted! Thank you.');
    location.href = '/';
  } else alert(json.error || 'Submit failed');
});
</script>
</body>
</html>
