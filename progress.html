<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Leaderboard</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #eee}
    th{text-align:left}
    .muted{color:#666;font-size:0.95rem}
  </style>
</head>
<body>
  <h2>Leaderboard</h2>
  <div id="loading" class="muted">Loading…</div>
  <table id="table" style="display:none">
    <thead><tr><th>Rank</th><th>User</th><th style="text-align:right">Answered</th><th style="text-align:right">Streak</th></tr></thead>
    <tbody id="body"></tbody>
  </table>

  <script>
    async function load() {
      const loading = document.getElementById('loading');
      const table = document.getElementById('table');
      const body = document.getElementById('body');
      try {
        const res = await fetch('/api/leaderboard');
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        const list = data.leaderboard || [];
        if (list.length === 0) {
          loading.textContent = 'No leaderboard data yet.';
          return;
        }
        body.innerHTML = '';
        list.forEach((r,i) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${i+1}</td><td>${escapeHtml(r.username||'—')}</td><td style="text-align:right">${r.total_answered||0}</td><td style="text-align:right">${r.streak||0}</td>`;
          body.appendChild(tr);
        });
        loading.style.display = 'none';
        table.style.display = 'table';
      } catch (e) {
        loading.textContent = 'Failed to load leaderboard.';
        console.error(e);
      }
    }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
